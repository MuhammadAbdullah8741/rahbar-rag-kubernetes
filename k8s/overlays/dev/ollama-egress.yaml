apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-host-egress
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - api
      - indexer
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.65.254/32
    ports:
    - protocol: TCP
      port: 11434
