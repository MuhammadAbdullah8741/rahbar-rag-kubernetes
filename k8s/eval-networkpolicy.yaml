apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a3-evaluation
  namespace: rahbar
spec:
  egress:
  - ports:
    - port: 8000
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: eval
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: eval
    ports:
    - port: 8000
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a3-eval-egress
  namespace: rahbar
spec:
  egress:
  - ports:
    - port: 8000
      protocol: TCP
    to:
    - podSelector: {}
  - ports:
    - port: 11434
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.168.65.254/32
  podSelector:
    matchLabels:
      app: eval
  policyTypes:
  - Egress
