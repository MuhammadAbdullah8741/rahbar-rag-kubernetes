apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: chroma
        image: chromadb/chroma:1.0.12
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: CHROMA_PERSIST_PATH
          value: /data
        - name: HOME
          value: /tmp
        - name: ANONYMIZED_TELEMETRY
          value: 'false'
        startupProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 2
          failureThreshold: 60
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
