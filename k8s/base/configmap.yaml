apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  RETRIEVER: chroma
  LLM_PROVIDER: ollama-host
  EMBED_MODEL: nomic-embed-text:latest
  EMBED_DIMENSION: '768'
  CHECK_DEPENDENCIES: 'true'
  CHROMA_HOST: chroma
  CHROMA_PORT: '8000'
  CHROMA_COLLECTION: rahbar
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  CHUNK_SIZE: '400'
  CHUNK_OVERLAP: '50'
  TOP_K: '5'
  RELEVANCE_FLOOR: '0.65'
  CACHE_THRESHOLD: '0.98'
  TEMPERATURE: '0.2'
  LLM_MODEL: llama3.2:3b
  OLLAMA_URL: http://host.minikube.internal:11434
  CORPUS_DIR: /corpus
  LOG_LEVEL: INFO
  LLM_TIMEOUT: '300'
  CACHE_ENABLED: 'true'
