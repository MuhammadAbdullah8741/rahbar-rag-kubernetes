apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: indexer
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: indexer
        image: rahbar-indexer:dev
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: corpus
          mountPath: /corpus
          readOnly: true
        envFrom:
        - configMapRef:
            name: rahbar-config
      volumes:
      - name: tmp
        emptyDir: {}
      - name: corpus
        persistentVolumeClaim:
          claimName: corpus
      terminationGracePeriodSeconds: 30
      restartPolicy: OnFailure
